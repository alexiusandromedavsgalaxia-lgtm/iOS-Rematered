  <!-- Splash screen mientras carga -->
  <style>
    #boot-splash {
      position: fixed;
      inset: 0;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      z-index: 99999;
      font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      transition: opacity .4s ease;
    }
    #boot-splash.is-hidden {
      opacity: 0;
      pointer-events: none;
    }
    #boot-splash svg {
      width: 64px;
      height: 64px;
      fill: #fff;
      animation: splash-pulse 1.6s ease-in-out infinite;
    }
    #boot-splash .splash-text {
      color: #8e8e93;
      font-size: 13px;
      letter-spacing: .5px;
      text-transform: uppercase;
      font-weight: 500;
    }
    #boot-splash .splash-bar {
      width: 120px;
      height: 3px;
      background: rgba(255,255,255,.1);
      border-radius: 2px;
      overflow: hidden;
      position: relative;
    }
    #boot-splash .splash-bar::after {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 40%;
      background: #fff;
      border-radius: 2px;
      animation: splash-bar 1.4s ease-in-out infinite;
    }
    @keyframes splash-pulse {
      0%, 100% { opacity: .55; }
      50%      { opacity: 1; }
    }
    @keyframes splash-bar {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }
  </style>

  <title>iOS Remastered</title>
</head>

  <script type="module" src="/src/main.jsx"></script>

  <!-- Ocultamos el splash cuando React monta -->
  <script>
    (function() {
      const hide = () => {
        const el = document.getElementById('boot-splash');
        if (!el) return;
        el.classList.add('is-hidden');
        setTimeout(() => el.remove(), 500);
      };
      // Esperamos un tick y un rAF para asegurarnos de que React pintó
      if (window.requestAnimationFrame) {
        window.requestAnimationFrame(() => {
          window.requestAnimationFrame(hide);
        });
      } else {
        setTimeout(hide, 100);
      }
