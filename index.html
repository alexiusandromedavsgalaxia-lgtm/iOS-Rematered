  <!-- Splash screen mientras carga -->
  <style>
    #boot-splash {
      position: fixed;
      inset: 0;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      z-index: 99999;
      font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      transition: opacity .4s ease;
    }
    #boot-splash.is-hidden {
      opacity: 0;
      pointer-events: none;
    }
    #boot-splash svg {
      width: 64px;
      height: 64px;
      fill: #fff;
      animation: splash-pulse 1.6s ease-in-out infinite;
    }
    #boot-splash .splash-text {
      color: #8e8e93;
      font-size: 13px;
      letter-spacing: .5px;
      text-transform: uppercase;
      font-weight: 500;
    }
    #boot-splash .splash-bar {
      width: 120px;
      height: 3px;
      background: rgba(255,255,255,.1);
      border-radius: 2px;
      overflow: hidden;
      position: relative;
    }
    #boot-splash .splash-bar::after {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 40%;
      background: #fff;
      border-radius: 2px;
      animation: splash-bar 1.4s ease-in-out infinite;
    }
    @keyframes splash-pulse {
      0%, 100% { opacity: .55; }
      50%      { opacity: 1; }
    }
    @keyframes splash-bar {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }
  </style>

  <title>iOS Remastered</title>
</head>
<body>
  <!-- Splash inicial, se oculta al montar React -->
  <div id="boot-splash">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M17.05 12.54c-.02-2.1 1.72-3.1 1.8-3.15-.98-1.44-2.5-1.63-3.04-1.65-1.3-.13-2.53.76-3.2.76-.66 0-1.67-.74-2.75-.72-1.42.02-2.73.82-3.46 2.09-1.48 2.56-.38 6.34 1.06 8.42.7 1.02 1.54 2.16 2.64 2.12 1.06-.04 1.46-.68 2.74-.68 1.28 0 1.64.68 2.76.66 1.14-.02 1.86-1.04 2.56-2.06.8-1.18 1.14-2.32 1.16-2.38-.03-.01-2.23-.86-2.25-3.4zM15.06 5.63c.58-.7.97-1.68.86-2.65-.83.03-1.84.55-2.44 1.25-.54.62-1 1.62-.88 2.57.93.07 1.88-.47 2.46-1.17z"/>
    </svg>
    <div class="splash-bar"></div>
    <div class="splash-text">iOS Remastered</div>
  </div>

  <noscript>
    <div style="color:#fff;background:#000;padding:40px;font-family:system-ui;text-align:center">
      <h1>JavaScript deshabilitado</h1>
      <p style="color:#8e8e93">iOS Remastered necesita JavaScript para ejecutarse.</p>
    </div>
  </noscript>

  <div id="root"></div>

  <!-- Capturador de errores en pantalla (visible en iPad sin consola) -->
  <script>
  (function() {
    function init() {
      var box = document.createElement('div');
      box.id = '__err';
      box.style.cssText = [
        'position:fixed',
        'left:0',
        'right:0',
        'bottom:0',
        'max-height:55%',
        'z-index:999999',
        'background:rgba(0,0,0,0.94)',
        'color:#fff',
        'font:11px ui-monospace,Menlo,monospace',
        'padding:12px',
        'overflow:auto',
        'white-space:pre-wrap',
        'word-break:break-word',
        'border-top:2px solid #ff453a',
        'display:none',
        '-webkit-overflow-scrolling:touch',
        'padding-bottom:calc(12px + env(safe-area-inset-bottom,0))'
      ].join(';');
      document.body.appendChild(box);

      var hidden = false;

      function show(msg, color) {
        if (hidden) return;
        box.style.display = 'block';
        var line = document.createElement('div');
        line.style.cssText = 'padding:4px 0;border-bottom:1px solid rgba(255,255,255,.08);color:' + (color || '#fff');
        line.textContent = msg;
        box.appendChild(line);
        box.scrollTop = box.scrollHeight;
        // Máximo 200 líneas
        while (box.children.length > 200) box.removeChild(box.firstChild);
      }

      function fmt(x) {
        try {
          if (x instanceof Error) return x.stack || x.message || String(x);
          if (typeof x === 'object') return JSON.stringify(x);
          return String(x);
        } catch (e) {
          return String(x);
        }
      }

      window.addEventListener('error', function(e) {
        if (e.target && e.target.tagName && e.target.tagName !== 'SCRIPT') return;
        show('❌ ' + (e.message || 'Error') + ' @ ' + (e.filename || '') + ':' + (e.lineno || ''), '#ff453a');
        if (e.error && e.error.stack) {
          show(e.error.stack, '#ff8a80');
        }
      }, true);

      window.addEventListener('unhandledrejection', function(e) {
        var r = e.reason;
        show('❌ Promesa: ' + (r && r.message ? r.message : fmt(r)), '#ff453a');
        if (r && r.stack) show(r.stack, '#ff8a80');
      });

      var origErr = console.error;
      console.error = function() {
        var args = Array.prototype.slice.call(arguments);
        show('❌ ' + args.map(fmt).join(' '), '#ff453a');
        try { origErr.apply(console, args); } catch (e) {}
      };

      var origWarn = console.warn;
      console.warn = function() {
        var args = Array.prototype.slice.call(arguments);
        show('⚠️ ' + args.map(fmt).join(' '), '#ffd60a');
        try { origWarn.apply(console, args); } catch (e) {}
      };

      var origLog = console.log;
      console.log = function() {
        var args = Array.prototype.slice.call(arguments);
        show('ℹ️ ' + args.map(fmt).join(' '), '#b0b0b0');
        try { origLog.apply(console, args); } catch (e) {}
      };

      // Botón flotante para ocultar/mostrar
      var toggle = document.createElement('button');
      toggle.textContent = '✕';
      toggle.style.cssText = [
        'position:fixed',
        'top:calc(10px + env(safe-area-inset-top,0))',
        'right:10px',
        'width:36px',
        'height:36px',
        'border-radius:50%',
        'background:rgba(0,0,0,0.7)',
        'color:#fff',
        'border:1px solid rgba(255,255,255,0.2)',
        'font-size:16px',
        'z-index:1000000',
        'cursor:pointer',
        'display:none'
      ].join(';');
      toggle.onclick = function() {
        hidden = !hidden;
        box.style.display = hidden ? 'none' : 'block';
        toggle.textContent = hidden ? '!' : '✕';
      };
      document.body.appendChild(toggle);

      // Mostrar el toggle en cuanto haya algo
      var origShow = show;
      show = function(m, c) {
        toggle.style.display = 'block';
        origShow(m, c);
      };

      // Doble tap arriba-izquierda limpia
      var taps = 0, t0 = 0;
      document.addEventListener('touchstart', function(e) {
        var t = e.touches[0];
        if (t.clientX < 60 && t.clientY < 60) {
          var now = Date.now();
          if (now - t0 < 400) {
            box.innerHTML = '';
            box.style.display = 'none';
            hidden = true;
            toggle.textContent = '!';
          }
          t0 = now;
        }
      }, { passive: true });
    }

    if (document.body) init();
    else document.addEventListener('DOMContentLoaded', init, { once: true });
  })();
  </script>

  <!-- App principal -->
  <script type="module" src="/src/main.jsx"></script>

  <!-- Ocultamos el splash cuando React monta -->
  <script>
    (function() {
      function hide() {
        var el = document.getElementById('boot-splash');
        if (!el) return;
        el.classList.add('is-hidden');
        setTimeout(function() { el.remove(); }, 500);
      }
      if (window.requestAnimationFrame) {
        window.requestAnimationFrame(function() {
          window.requestAnimationFrame(hide);
        });
      } else {
        setTimeout(hide, 100);
      }
      // Red de seguridad: ocultar tras 6s pase lo que pase
      setTimeout(hide, 6000);
    })();
  </script>
</body>
